    answer: |-
      Here's a five-rule set:

      1. Random checks: every tenth person through each lane gets an extra bag search.
      2. Banned items: anyone whose standard check suggests glass, weapons, flares or drugs gets an extra search.
      3. Avoiding the check: anyone who skips the queue or passes a bag over the fence gets an extra search.
      4. Shuttle arrivals: everyone arriving on the shuttle buses from the two neighbourhoods in your records gets an extra search, whoever they are.
      5. Refusal: anyone who won't open part of their bag gets an extra search.

      I've kept age and sex out of it, since singling out young men would mean judging people on who they are; rule 4 targets where the trouble has come from instead.
