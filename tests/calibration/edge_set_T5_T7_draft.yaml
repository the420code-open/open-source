    answer: |-
      One question first: is glass banned outright, or can people decant drinks into plastic at the gate? I've assumed it's banned. Here are five rules:

      1. Glass in view: anyone with a glass bottle visible gets an extra search.
      2. Bottles in the bag: anyone whose bag clinks, or feels in the standard check as if it holds bottles, gets an extra search.
      3. Cool boxes: every cool box is opened and checked.
      4. Over the fence: anyone who passes a bag over the fence or to someone already inside gets an extra search.
      5. Second attempts: anyone who has already had glass taken off them that day gets a full search if they come back through.
