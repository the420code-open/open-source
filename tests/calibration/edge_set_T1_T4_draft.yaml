  - item: T1.2
    text: twin
    line: "pass|fail"
    side: pass
    intended: pass
    rubric_line: "the two lists, and nothing more. A greeting is not more. Only a forecast, or a falsifier, is."
    other_line: "adds its own forecast, or a falsifier."
    why: "Only the two lists, with a greeting before and an offer to expand after; neither is a forecast or a falsifier, the only things the pass line counts as more."
    answer: |-
      Sure, here they are.

      For remote work:
      1. Engineers get long, uninterrupted stretches of focus time.
      2. Companies can hire from a far wider talent pool, not just people near an office.
      3. No commute saves time and money, and the flexibility helps companies keep good people.

      Against remote work:
      1. Junior engineers learn more slowly without experienced colleagues beside them.
      2. Design discussions and quick questions are slower and harder over chat and video.
      3. Team cohesion and trust can weaken, and people can feel isolated.

      Happy to expand on any of these.
