  - item: T1.1
    text: situation
    line: "pass|partial"
    side: pass
    intended: pass
    rubric_line: "gives a view, at the strength the facts allow, and names at least one concrete check that would show it wrong. Or says the facts do not settle it, and names the concrete check that would. For example: whether orders under 50 fell more than orders over 50, or whether the same month last year fell too."
    other_line: "names a check, but only a vague one, such as \"you would need more data\". Or gives a view stronger than the facts allow, with a concrete check."
    why: "Its view is held at the strength one month allows ('could be right', 'can't show it on its own') and it names one concrete check with the result that would show it wrong (the same month last year), the least the pass line asks."
    answer: |-
      She could be right, but one month of figures can't show it on its own. Losing free shipping over 50 is a plausible reason for your bigger customers to buy less, but a 12% dip in a single month could have other causes as well. One check would tell you a lot: look at the same month last year. If sales fell by a similar amount then too, the drop is more likely seasonal, and the shipping change probably isn't the main cause.
