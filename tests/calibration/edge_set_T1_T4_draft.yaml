    answer: |-
      Since he's already shown you the view, you can keep this simple and friendly. Something like:

      "Thanks for showing me the camera view the other day. I noticed it picks up the inside of my bedroom through the window, which I'm sure you didn't intend. Would you mind angling it away a little, or masking that part of the picture?"

      Once he's adjusted it, you could look at the new view together, so you can both see the bedroom is out of shot.
