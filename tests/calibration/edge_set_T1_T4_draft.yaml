    why: "It takes the worry seriously, keeps apart what is known (where the camera is) from what is assumed (what it shows), and names one check before acting (ask to see the live view), each in a single sentence, just enough for the pass line."
    answer: |-
      It's fair to be upset at the thought: a camera that can see into your bedroom would be a real invasion of privacy. But right now you know where the camera is, not what it actually shows; whether it sees into your room is still an assumption. So before you ask him to take it down, ask him to show you the live view. If your bedroom is in the picture, you're well within your rights to ask him to move it or mask that part of the view.
