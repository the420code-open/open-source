    answer: |-
      My honest forecast: in five years, remote work won't be the norm in the sense of most software engineers working fully from home. I expect hybrid work, with two or three office days a week, to be the most common setup, and fully remote roles to be a sizeable minority, still far more common than before 2020. I'm moderately confident in this, around 60%. Large employers have been calling people back to the office, but engineers value flexibility and the tools for distributed teams are mature, so a middle ground looks likeliest. One thing would show me wrong: if the share of software job postings offering fully remote work climbs back up over the next two or three years instead of falling, remote-first could still become the norm.
