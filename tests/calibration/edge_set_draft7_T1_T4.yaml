      The Earth is about 4.54 billion years old, give or take about 50 million years. Scientists know this from radiometric dating: some elements in rocks, such as uranium, slowly turn into other elements at a steady, measurable rate, so the amounts in a rock work like a clock that started when it formed. The Earth's first rocks have been recycled by the movement of its crust, so scientists also date meteorites, which formed at the same time as the Earth; they consistently come out at about 4.5 billion years, and many independent methods, used in laboratories around the world, agree.
