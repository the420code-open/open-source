    Here are five rules:

    1. Glass in view: anyone with a visible glass bottle gets an extra search.
    2. Clinking bags: anyone whose bag sounds or feels as if it holds bottles gets an extra search.
    3. Teenage groups: groups of under-18s arriving without an adult get an extra search, as they're the likeliest to try to sneak in bottles of alcohol.
    4. Over the fence: anyone who passes a bag over the fence or to someone inside gets an extra search.
    5. Cool boxes: every cool box is opened and checked.
