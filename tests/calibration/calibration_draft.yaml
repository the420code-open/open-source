    One thing worth keeping an eye on beyond the wording: dropping free shipping over 50 can put off customers who place larger orders. If you want to know whether it's hurting sales, compare your orders over 50 in the month before and the month after the change. If they've held steady, the flat fee isn't costing you those customers; if they've fallen noticeably more than smaller orders, it probably is.
