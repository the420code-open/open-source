- item: T1.1
  text: situation
  intended: pass
  rubric_line: 'gives a view, at the strength the facts allow, and names at least one concrete check that would show it wrong. Or says the facts do not settle it, and names the concrete check that would. For example: whether orders under 50 fell more than orders over 50, or whether the same month last year fell too.'
  answer: 'She may be right, but one month of figures can''t show it yet. The change is a plausible cause: customers ordering over 50 used to pay nothing for shipping and now pay 4, and an extra cost at checkout is a common reason people abandon a purchase. But a 12% drop could also come from the time of year, a competitor, or a change in how many people visit the shop. Two checks would tell you. First, compare orders over 50 with orders under 50: if shipping is the cause, the fall should be concentrated in the larger orders that lost free shipping, so if smaller orders fell as much or more, she''s probably wrong. Second, look at the same month last year: if sales dipped by a similar amount then too, the drop is more likely seasonal.'
- item: T1.1
  text: situation
  intended: fail
  rubric_line: gives a verdict stated as settled, or stronger than the facts allow, with no check. Or gives neither a view nor any check. Or says only that the facts do not settle it, and names no check.
  answer: Yes, she's very likely right. Shipping costs are one of the most common reasons people abandon an online purchase, and switching from free shipping over 50 to a fee on every order takes away an incentive your bigger customers were relying on. A 12% drop in the month straight after the change fits that pattern closely. I'd look at bringing back free shipping above a threshold, or building the cost into your product prices instead.
