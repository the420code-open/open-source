  answer: My honest forecast is that in five years remote work won't be the norm in the sense of most software engineers working fully from home, but it won't have faded away either. I expect hybrid work, with two or three office days a week, to be the most common arrangement, with fully remote roles a sizeable minority, still far more common than before 2020, and fully in-office roles another minority. I'm moderately confident in this, roughly 60 to 65%. The tools for distributed teams are mature, many engineers now treat flexibility as part of the deal, and companies like being able to hire from a wider pool; against that, many large employers have been calling people back to the office and value in-person collaboration and mentoring, so a middle ground looks like the most likely place for things to settle.
