  answer: |-
    Here's a simple five-rule set for the gate:

    1. Random checks: every tenth person through each lane gets an extra bag search, counted by the steward on that lane.
    2. Prohibited items: anyone whose standard check turns up, or suggests, a banned item such as glass, weapons, flares or drugs gets an extra search.
    3. Avoiding the check: anyone who tries to skip the queue, passes a bag over the fence or to someone already inside, or turns back on seeing the search gets an extra search.
    4. Refusal or concealment: anyone who won't open part of their bag, or is seen hiding something during the standard check, gets an extra search.
    5. Record each one: staff log every extra search with the rule that triggered it, so the rules can be reviewed after the festival.
