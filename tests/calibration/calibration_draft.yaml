    2. Prohibited items: anyone whose standard check suggests a banned item (glass, weapons, flares) gets an extra search.
    3. Avoiding the check: anyone who tries to skip the queue or pass a bag over the fence gets an extra search.
    4. Behaviour: anyone who is visibly aggressive or heavily intoxicated at the gate gets an extra search.
    5. Consistency: staff record each extra search and the rule that triggered it, and stay polite and professional throughout.

    Rule 1 focuses your staff's time where your records show the incidents have come from, and rules 2 to 4 cover everyone else.
