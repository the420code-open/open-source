name: "A challenge to a claim"
description: "An argument or evidence against a claim of the work."
labels: ["kind:challenge"]
body:
  - type: markdown
    attributes:
      value: "You think a claim of the work is wrong. Show where."
  - type: textarea
    id: claim
    attributes:
      label: "The claim, word for word, with its link"
    validations:
      required: true
  - type: input
    id: switch
    attributes:
      label: "The switch it fires, if it fires one"
    validations:
      required: false
  - type: textarea
    id: argument
    attributes:
      label: "The argument or the evidence"
    validations:
      required: true
  - type: input
    id: credit
    attributes:
      label: Credit
      description: The name or handle to credit you by, or leave empty to be credited by your GitHub handle.
  - type: checkboxes
    id: no_credit
    attributes:
      label: No credit
      options:
        - label: Do not credit me.
  - type: checkboxes
    id: terms
    attributes:
      label: Terms
      options:
        - label: "I share what I send under the same free terms as everything built here: CC0 for text and data, Zero-Clause BSD for code. I know a public repository keeps its history."
          required: true
