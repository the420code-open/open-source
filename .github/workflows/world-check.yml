name: world check
on:
  push:
    paths: ["world/**", ".github/workflows/world-check.yml"]
  workflow_dispatch:
permissions: {}
concurrency:
  group: world-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m pip install --quiet "numpy>=2.1,<3"
      - name: the reference, against every test value
        run: python3 world/reference/check.py
      - name: the browser world, against every test value, under Node
        run: |
          if [ -f world/browser/check.mjs ]; then
            cd world/browser && node check.mjs
          else
            echo "The browser world is not in this commit yet."
          fi
