name: floor check
on:
  push:
    paths: ["floor/**"]
  schedule:
    - cron: "11 4 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "check, or snapshot"
        required: false
        default: "check"
permissions: {}
concurrency:
  group: floor-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - run: python3 -m pip install --quiet "pyyaml==6.0.2" "jsonschema==4.23.0"
      - run: |
          if [ "$MODE" = "snapshot" ]; then python3 floor/checker/check.py --snapshot; else python3 floor/checker/check.py --write; fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode || 'check' }}
